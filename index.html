<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carga de Productos - Bucle While</title>
    
    <!-- CSS para mejorar la apariencia del sistema -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 30px;
            max-width: 500px;
            margin: auto;
        }
        h2, h3 {
            color: #333;
        }
        form {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            padding: 9px 15px;
            margin-right: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }
        button[onclick="agregarProducto()"] {
            background-color: #28a745;
        }
        button[onclick="agregarProducto()"]:hover {
            background-color: #218838;
        }
        button[onclick="cerrarLote()"] {
            background-color: #007bff;
        }
        button[onclick="cerrarLote()"]:hover {
            background-color: #0056b3;
        }
        ul {
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        li {
            margin-bottom: 5px;
        }
        #estadoInventario {
            font-weight: bold;
            color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Registro de Productos en Inventario</h2>
    <form id="inventarioForm" onsubmit="return false;">
        <label for="productoInput">Nombre del Producto:</label><br>
        <input type="text" id="productoInput"><br><br>

        <button type="button" onclick="agregarProducto()">Guardar Producto</button>
        <button type="button" onclick="cerrarLote()">Finalizar Carga</button>
    </form>

    <h3>Productos Guardados en la Sesión:</h3>
    <ul id="listaProductos"></ul>
    <p id="estadoInventario"></p>

    <script>
        let inventario = [];

        function agregarProducto()
        {
            let inputProducto = document.getElementById("productoInput");
            let nombre = inputProducto.value;

            if (nombre.trim() === "") 
            {
                alert("Ingrese un nombre válido de producto.");
                inputProducto.focus(); 
                return;
            }

            
            inventario.push(nombre);
            inputProducto.value = ""; 
            inputProducto.focus();   
            
            mostrarLista();
        }

        function mostrarLista() {
            let listaHTML = document.getElementById("listaProductos");
            listaHTML.innerHTML = "";
            
            let index = 0;
            
            while (index < inventario.length)
            {
                let item = document.createElement("li");
                item.innerText = "Producto N° " + (index + 1) + ": " + inventario[index];
                listaHTML.appendChild(item);
                index++;
            }
        }

        function cerrarLote() {
            document.getElementById("estadoInventario").innerText = "Lote cerrado con " + inventario.length + " productos registrados.";
        }
    </script>

</body>
</html>
